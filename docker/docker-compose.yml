services:
  postgres:
    image: postgres:15-alpine
    container_name: shoppi_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shoppi_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: shoppi_backend
    restart: always
    env_file:
      - ../apps/backend/.env
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    volumes:
      - ../apps/backend:/usr/src/app
      - /usr/src/app/node_modules 
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: shoppi_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: